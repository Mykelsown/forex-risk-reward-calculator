<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyForex Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              priBlues: {
                950: "#000E24",
                900: "#001433",
                800: "#002966",
                700: "#003D99",
                600: "#0052CC",
                500: "#0066FF",
                400: "#3385FF",
                300: "#66A3FF",
                200: "#99C2FF",
                100: "#CCE0FF",
                50: "#E5F0FF",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-[radial-gradient(circle_at_center,#001433_45%,#000E24_100%)] m-5"
  >
    <header class="flex item-center justify-center pt-9 pb-9">
      <div class="text-center">
        <div class="flex justify-center">
          <img src="./images/fx-logo.jpg" alt="MyForex-logo" class="w-9" />
        </div>
        <h1 class="text-white text-3xl font-bold mb-2 mt-2">
          MyForex Calculator
        </h1>
        <p class="text-gray-400">
          Professional Position Sizing & Risk Management
        </p>
      </div>
    </header>
    <main class="flex flex-col item-center justify-center pt-9 pb-9">
      <!-- first hald of the card: trading parameter section -->
      <div
        class="bg-priBlues-900 rounded-t-2xl outline outline-gray-600 p-9 w-full"
      >
        <div class="flex justify-between place-items-baseline">
          <h2 class="text-white font-bold text-xl">Trade Parameters</h2>
          <div class="text-gray-400">&#10227; Reset</div>
        </div>
        <div class="mt-3 mb-3">
          <div class="flex flex-col leading-9">
            <label for="accbalance" class="text-gray-400"
              >Account Balance <span class="text-sm">&#10068;</span>
            </label>
            <input
              type="number"
              name="accbalance"
              id="accbalance"
              class="rounded-lg"
            />
          </div>

          <div class="flex flex-col leading-9">
            <label for="riskPercent" class="text-gray-400"
              >Risk Percentage <span class="text-sm">&#10068;</span>
            </label>
            <input
              type="number"
              name="riskPercent"
              id="riskPercent"
              class="rounded-lg"
            />
          </div>

          <div class="flex flex-col leading-9">
            <label for="currencypair" class="text-gray-400"
              >Currency Pair
            </label>
            <select name="currencypair" id="currencypair">
              <option value="eurusd">EUR/USD</option>
              <option value="gbpusd">GBP/USD</option>
              <option value="usdjpy">JPY/USD</option>
              <option value="xauusd">XAU/USD</option>
            </select>
          </div>

          <div class="flex flex-col leading-9">
            <label for="entry" class="text-gray-400">Entry Point</label>
            <input type="number" name="entry" id="entry" class="rounded-lg" />
          </div>

          <div class="flex flex-col leading-9">
            <label for="stoploss" class="text-gray-400">Stop Loss</label>
            <input
              type="number"
              name="stoploss"
              id="stoploss"
              class="rounded-lg"
            />
          </div>

          <div class="flex flex-col leading-9">
            <label for="takeprofit" class="text-gray-400">Take Profit</label>
            <input
              type="number"
              name="takeprofit"
              id="takeprofit"
              class="rounded-lg"
            />
          </div>

          <button
            class="bg-gradient-to-r from-priBlues-500 to-purple-500 text-white text-lg w-full rounded-lg font-bold py-3 mt-5"
          >
            Calculate Position <span class="text-2xl">&rarr;</span>
          </button>
        </div>
      </div>

      <!-- second half of the card: the result section -->
      <div
        class="bg-priBlues-900 rounded-b-2xl outline outline-gray-600 p-6 w-full"
      >
        <div class="flex flex-col item-center gap-y-6">
          <div class="flex place-items-baseline">
            <img
              src="./images/analysis.png"
              alt="analysis-icon"
              class="w-5 mr-1"
            />
            <h2 class="text-white font-bold text-xl">Results</h2>
          </div>

          <!-- risk amount and reward amount section-->
          <div class="flex flex-col gap-y-4">
            <!-- risk amount -->
            <div
              class="flex flex-col border-l-4 border-red-500 rounded-xl bg-priBlues-800 p-4"
            >
              <h3 class="text-gray-400 text-sm">RISK AMOUNT</h3>
              <div class="flex justify-between place-items-baseline">
                <p class="risk-in-dollars text-white font-bold text-2xl">
                  $0.00
                </p>
                <p class="text-red-400 text-sm">0.00 pips</p>
              </div>
            </div>

            <!-- reward amount -->
            <div
              class="flex flex-col border-l-4 border-green-500 rounded-xl bg-priBlues-800 p-4"
            >
              <h3 class="text-gray-400 text-sm">RISK AMOUNT</h3>
              <div class="flex justify-between place-items-baseline">
                <p class="risk-in-dollars text-white font-bold text-2xl">
                  $0.00
                </p>
                <p class="text-red-400 text-sm">0.00 pips</p>
              </div>
            </div>
          </div>

          <!-- risk/reward ratio -->
          <div class="flex flex-col">
            <div class="flex justify-between">
              <p class="text-gray-400 text-sm">Risk/Reward Ratio</p>
              <p class="text-white text-sm font-bold">1 : 0</p>
            </div>
            <div class="flex">
              <div class="bg-red-500 size-3 grow-3 rounded-l-lg -mr-1"></div>
              <div class="bg-gray-500 size-3 grow rounded-r-lg"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
